<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<script src="../constants.js"></script>
		<script src="preload.js"></script>
		<link type="text/css" rel="stylesheet" href="./css/popup.css" />
		<script defer src="../utils.js"></script>
		<script defer src="localize.js"></script>
		<script defer src="header.js"></script>
		<script defer src="navigation.js"></script>
		<script defer src="aiConversationSecurity.js"></script>
		<title>ai_conversation_security_header</title>
	</head>

	<body>
		<div class="main-container">
			<header id="popup-header"></header>

			<div class="main-content">
				<div id="popup-subheader">
					<h3 class="localizable" data-i18n="ai_conversation_security_header"></h3>
					<p class="localizable" data-i18n="ai_conversation_security_description"></p>
				</div>
				<div id="main-section">
					<div class="flex-row feature-activation-section">
						<div class="fl">
							<h4 class="localizable" data-i18n="ai_conversation_security_scan_func_header"></h4>
							<div class="sub-text">
								<p class="localizable" data-i18n="ai_conversation_security_scan_func_description"></p>
							</div>
						</div>
						<div class="fr">
							<div class="box-center">
								<label for="scan-switch" class="switch">
									<input type="checkbox" name="scan" id="scan-switch" />
									<span id="scan-slider" class="slider round"></span>
								</label>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</body>
</html>
